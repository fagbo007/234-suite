[package]
name = "sheet"
version = "0.0.0"
description = "234 Sheet"
edition = "2021"
rust-version = "1.77"

[lib]
name = "sheet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
app234-ai = { path = "../../../packages/ai-backend" }
