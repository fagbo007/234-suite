[package]
name = "app234-ai"
version = "0.0.0"
description = "234 suite AI backend — OS-keychain key storage + cloud completions"
edition = "2021"
rust-version = "1.77"

[lib]
name = "app234_ai"

[dependencies]
serde_json = "1"
# OS keychain: Windows Credential Manager / macOS Keychain / Linux Secret Service.
keyring = { version = "3", features = [
  "windows-native",
  "apple-native",
  "sync-secret-service",
  "crypto-rust",
] }
# Blocking HTTPS for the cloud calls. native-tls → SChannel on Windows (no ring/asm).
ureq = { version = "2", default-features = false, features = ["native-tls"] }
# §6 fallback when no OS keychain is available: an AES-256-GCM encrypted file in
# the app data dir, keyed by a machine-specific id. Never plaintext.
aes-gcm = "0.10"
sha2 = "0.10"
machine-uid = "0.5"
dirs = "6"
