# Temporary diagnostic for issue #1: WiX light.exe fails building the MSI on
# the space-free CI checkout, and a plain `tauri build` swallows light's
# stderr. This dispatch-only workflow builds just the Writer MSI with
# --verbose to capture the real error. Delete once #1 is fixed.

name: MSI debug

on:
  workflow_dispatch:

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Writer MSI (verbose)
        run: pnpm --filter "@234/writer" tauri build --verbose --bundles msi
