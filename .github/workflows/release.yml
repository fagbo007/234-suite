name: Release

# Builds the per-app installers + the single suite installer for each OS and,
# on a version tag, attaches them to a GitHub Release (root CLAUDE.md §3.2, §9).
# Like ci.yml, this is dormant until a public remote + a `v*` tag exist.
#
# Per OS: Windows → NSIS + MSI (MSI needs the explicit bundle.publisher —
# a derived numeric "234" author fails WiX ICE39, see issue #1); macOS →
# .app + .dmg (universal); Linux → .deb + .AppImage. Then the matching
# suite-assembly script bundles all four apps.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# The release step creates the GitHub Release; the default token is read-only.
permissions:
  contents: write

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
            suite: pwsh installer/build-suite.ps1
          # macos-latest is arm64; the universal target also serves Intel macs.
          - os: macos-latest
            bundles: app,dmg
            target: --target universal-apple-darwin
            suite: bash installer/build-suite-macos.sh
          - os: ubuntu-latest
            bundles: deb,appimage
            suite: bash installer/build-suite-linux.sh
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable corepack (pnpm)
        run: corepack enable

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS universal targets
        if: matrix.os == 'macos-latest'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Install Linux Tauri dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundles
        shell: bash
        run: |
          for app in writer sheet slides launcher; do
            pnpm --filter "@234/$app" tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target }}
          done

      - name: Resolve version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Build suite installer
        shell: bash
        run: ${{ matrix.suite }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 234-suite-${{ matrix.os }}
          path: |
            installer/dist/*
            apps/*/src-tauri/target/release/bundle/**/*
            apps/*/src-tauri/target/universal-apple-darwin/release/bundle/**/*
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Extension-restricted: Tauri leaves helper files in the bundle dirs
          # (e.g. four identically-named dmg/bundle_dmg.sh), and same-named
          # uploads make the release step fail after the first one.
          files: |
            installer/dist/*
            apps/*/src-tauri/target/release/bundle/nsis/*.exe
            apps/*/src-tauri/target/release/bundle/msi/*.msi
            apps/*/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/*/src-tauri/target/release/bundle/deb/*.deb
            apps/*/src-tauri/target/release/bundle/appimage/*.AppImage
